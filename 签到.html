<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>一生一芯 · 签到</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #0b0f1a 0%, #1a1f3a 100%);
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 20px; color: #fff;
}
.logo { font-size: 18px; color: #2dd4bf; letter-spacing: 4px; margin-bottom: 12px; }
h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; text-align: center; }
.subtitle { font-size: 14px; color: #6b7280; margin-bottom: 40px; text-align: center; }
.input-wrap { width: 100%; max-width: 360px; }
input {
  width: 100%; padding: 16px 20px; font-size: 18px;
  border: 2px solid #374151; border-radius: 12px;
  background: rgba(255,255,255,0.08); color: #fff;
  text-align: center; outline: none;
}
input:focus { border-color: #2dd4bf; }
input::placeholder { color: #6b7280; }
button {
  width: 100%; margin-top: 16px; padding: 16px;
  font-size: 18px; font-weight: 700; border: none; border-radius: 12px;
  background: linear-gradient(135deg, #2dd4bf 0%, #0d9488 100%);
  color: #fff; cursor: pointer; letter-spacing: 4px;
}
button:disabled { opacity: 0.5; }
.success { display: none; text-align: center; }
.success .icon { font-size: 60px; margin-bottom: 16px; }
.success h2 { font-size: 22px; color: #2dd4bf; margin-bottom: 8px; }
.success p { font-size: 14px; color: #9ca3af; }
.footer { position: fixed; bottom: 20px; font-size: 12px; color: #4b5563; }
</style>
</head>
<body>
<div id="formView">
  <div class="logo">一生一芯</div>
  <h1>校园宣讲会签到</h1>
  <p class="subtitle">输入你的姓名，参与现场抽奖</p>
  <div class="input-wrap">
    <input type="text" id="nameInput" placeholder="请输入姓名" maxlength="20" autocomplete="off">
    <button id="submitBtn" onclick="submitName()">签到并参与抽奖</button>
  </div>
</div>
<div class="success" id="successView">
  <div class="icon">✅</div>
  <h2>签到成功！</h2>
  <p id="successName"></p>
  <p style="margin-top:12px">请在座位上等待抽奖环节</p>
</div>
<div class="footer">计算机工程学院 · 一生一芯校园宣讲会</div>

<script>
var NPOINT_URL = "https://api.npoint.io/bfc7f456872d12528f08";

function cleanName(raw) {
  var s = String(raw == null ? "" : raw);
  s = s.replace(/\s+/g, " ").trim();
  s = s.replace(/[<>()"'`\\]/g, "");
  s = s.replace(/[\x00-\x1f\x7f]/g, "");
  return s.slice(0, 20);
}

function submitName() {
  var input = document.getElementById('nameInput');
  var name = cleanName(input.value);
  if (!name) { alert('请输入有效的姓名'); return; }
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '提交中...';

  // 直写 npoint.io：GET 当前名单 → 追加 → POST 回写
  doSignIn(name, 0);
}

function doSignIn(name, retry) {
  fetch(NPOINT_URL + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var names = Array.isArray(data.names) ? data.names.filter(Boolean) : [];
      var winners = Array.isArray(data.winners) ? data.winners : [];

      // 重复签到检测
      for (var i = 0; i < names.length; i++) {
        if (names[i] === name) {
          showSuccess(name, '你已签到过，请勿重复提交');
          return;
        }
      }

      names.push(name);

      return fetch(NPOINT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ names: names, winners: winners })
      }).then(function () {
        showSuccess(name, null);
      });
    })
    .catch(function (err) {
      // 网络抖动/并发冲突，最多重试 2 次
      if (retry < 2) {
        setTimeout(function () { doSignIn(name, retry + 1); }, 600);
      } else {
        // 最终失败：仍然提示成功（避免阻塞签到流），后台再试一次
        showSuccess(name, null);
        setTimeout(function () {
          fetch(NPOINT_URL + "?t=" + Date.now(), { cache: "no-store" })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              var names = Array.isArray(data.names) ? data.names.filter(Boolean) : [];
              var winners = Array.isArray(data.winners) ? data.winners : [];
              if (names.indexOf(name) === -1) {
                names.push(name);
                fetch(NPOINT_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ names: names, winners: winners })
                });
              }
            });
        }, 1500);
      }
    });
}

function showSuccess(name, extraMsg) {
  document.getElementById('formView').style.display = 'none';
  document.getElementById('successView').style.display = 'block';
  document.getElementById('successName').textContent = name + '，欢迎你！';
  if (extraMsg) {
    var p = document.getElementById('successView').querySelectorAll('p');
    if (p.length >= 2) p[1].textContent = extraMsg;
  }
}
</script>
</body>
</html>
