<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>一生一芯 · 签到</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #0b0f1a 0%, #1a1f3a 100%);
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 20px; color: #fff;
}
.logo { font-size: 18px; color: #2dd4bf; letter-spacing: 4px; margin-bottom: 12px; }
h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; text-align: center; }
.subtitle { font-size: 14px; color: #6b7280; margin-bottom: 40px; text-align: center; }
.input-wrap { width: 100%; max-width: 360px; }
input {
  width: 100%; padding: 16px 20px; font-size: 18px;
  border: 2px solid #374151; border-radius: 12px;
  background: rgba(255,255,255,0.08); color: #fff;
  text-align: center; outline: none;
}
input:focus { border-color: #2dd4bf; }
input::placeholder { color: #6b7280; }
button {
  width: 100%; margin-top: 16px; padding: 16px;
  font-size: 18px; font-weight: 700; border: none; border-radius: 12px;
  background: linear-gradient(135deg, #2dd4bf 0%, #0d9488 100%);
  color: #fff; cursor: pointer; letter-spacing: 4px;
}
button:disabled { opacity: 0.5; }
.success { display: none; text-align: center; }
.success .icon { font-size: 60px; margin-bottom: 16px; }
.success h2 { font-size: 22px; color: #2dd4bf; margin-bottom: 8px; }
.success p { font-size: 14px; color: #9ca3af; }
.footer { position: fixed; bottom: 20px; font-size: 12px; color: #4b5563; }
</style>
</head>
<body>
<div id="formView">
  <div class="logo">一生一芯</div>
  <h1>校园宣讲会签到</h1>
  <p class="subtitle">输入你的姓名，参与现场抽奖</p>
  <div class="input-wrap">
    <input type="text" id="nameInput" placeholder="请输入姓名" maxlength="20" autocomplete="off">
    <button onclick="submitName()">签到并参与抽奖</button>
  </div>
</div>
<div class="success" id="successView">
  <div class="icon">✅</div>
  <h2>签到成功！</h2>
  <p id="successName"></p>
  <p style="margin-top:12px">请在座位上等待抽奖环节</p>
</div>
<div class="footer">计算机工程学院 · 一生一芯校园宣讲会</div>

<script>
const WEBHOOK = "https://webhook.site/6e2a71b3-5582-4315-be38-390f9f541ddb";

function submitName() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { alert('请输入姓名'); return; }
  const btn = document.querySelector('button');
  btn.disabled = true;
  btn.textContent = '提交中...';

  // 用图片加载方式发送GET请求，绕过CORS
  const img = new Image();
  img.onload = () => showSuccess(name);
  img.onerror = () => showSuccess(name); // 即使加载失败也算成功（webhook已记录）
  img.src = WEBHOOK + "?name=" + encodeURIComponent(name) + "&t=" + Date.now();

  // 兜底：1.5秒后无论如何都显示成功
  setTimeout(() => showSuccess(name), 1500);
}

function showSuccess(name) {
  document.getElementById('formView').style.display = 'none';
  document.getElementById('successView').style.display = 'block';
  document.getElementById('successName').textContent = name + '，欢迎你！';
}
</script>
</body>
</html>
